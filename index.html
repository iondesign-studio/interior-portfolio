<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極致空間設計 | 室內設計作品集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="logo">[ion]<sup>+</sup> DESIGN</div>
    <nav>
      <a href="#about">關於我們</a>
      <a href="#portfolio">作品案例</a>
      <a href="#contact">聯絡我們</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>重塑光的流動，定義空間的溫度</h1>
      <p>專注於極簡美學與人文質感的現代室內設計實踐</p>
    </div>
  </section>

  <!-- Portfolio Grid Section -->
  <section id="portfolio" class="portfolio-container">
    <h2>精選案例</h2>
    <p class="subtitle">探索我們近期的住宅與商業空間作品</p>

    <div class="portfolio-grid">
      
      <!-- 作品卡片 1 -->
      <article class="portfolio-card">
        <div class="card-image">
          <img src="https://picsum.photos/800/600?random=1" alt="極簡光影宅" loading="lazy" width="800" height="600">
        </div>
        <div class="card-info">
          <span class="category">現代住宅</span>
          <h3>極簡光影宅</h3>
          <p>台北市 · 35 坪 · 運用天然大理石與隱藏式光源塑造寧靜氛圍</p>
        </div>
      </article>

      <!-- 作品卡片 2 -->
      <article class="portfolio-card">
        <div class="card-image">
          <img src="https://picsum.photos/800/600?random=2" alt="侘寂風人文居家" loading="lazy" width="800" height="600">
        </div>
        <div class="card-info">
          <span class="category">侘寂風</span>
          <h3>靜寂之境</h3>
          <p>新北市 · 42 坪 · 特殊塗料與微水泥的沉靜質地交織</p>
        </div>
      </article>

      <!-- 作品卡片 3 -->
      <article class="portfolio-card">
        <div class="card-image">
          <img src="https://picsum.photos/800/600?random=3" alt="精品咖啡廳設計" loading="lazy" width="800" height="600">
        </div>
        <div class="card-info">
          <span class="category">商業空間</span>
          <h3>Urban Roast Cafe</h3>
          <p>台中市 · 50 坪 · 金屬質感與溫潤木質結合的商業體驗場域</p>
        </div>
      </article>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 ion⁺ Design Studio. All rights reserved.</p>
  </footer>

</body>
</html>
